<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preconnect" href="%PUBLIC_URL%" crossorigin="anonymous" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- single-domain policy: base stylesheets are vendored (public/static/vendor,
         pinned to the same cdnjs versions/bytes) and served same-origin; loaded as
         plain links since same-origin CSS is no longer worth the async dance.
         Root-relative on purpose — a CDN-prefixed PUBLIC_URL would defeat
         single-origin. Google Fonts stay external by decision (CJK self-hosting is
         high-risk; blocked regions fall back to system fonts) — CSP enumerates them.
         The cdnjs / static.kolable.com preconnects are gone with the hosts. -->
    <link rel="stylesheet" href="/static/vendor/normalize.min.css" />
    <link rel="stylesheet" href="/static/vendor/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="/static/vendor/animate.min.css" />
    <link rel="stylesheet" type="text/css" charset="UTF-8" href="/static/vendor/slick.min.css" />
    <link rel="stylesheet" type="text/css" href="/static/vendor/slick-theme.min.css" />
    <link href="/amp/latest/skins/amp-default/azuremediaplayer.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="preload" as="style" />
    <link
      href="https://fonts.googleapis.com/css?family=Noto+Sans+TC:400,500,700&display=swap&subset=chinese-traditional"
      rel="preload"
      as="style"
    />

    <link
      rel="stylesheet"
      href="/amp/latest/skins/amp-default/azuremediaplayer.min.css"
      media="print"
      onload="this.media='all';"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap"
      media="print"
      onload="this.media='all';"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Noto+Sans+TC:400,500,700&display=swap&subset=chinese-traditional"
      media="print"
      onload="this.media='all';"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script defer src="/static/vendor/array-flat-polyfill.min.js"></script>
    <script defer src="https://js.tappaysdk.com/tpdirect/v5.7.0"></script>
  </body>
</html>
